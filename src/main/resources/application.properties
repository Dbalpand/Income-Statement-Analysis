spring.application.name=income-statement-analysis

spring.profiles.active=dev

server.port=8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jackson.serialization.indent-output=true

management.endpoints.web.exposure.include=*

logging.level.root=INFO
logging.level.com.divyesh=DEBUG

aws.access-key=YOUR_ACCESS_KEY
aws.secret-key=YOUR_SECRET_KEY
aws.region=us-east-1

bedrock.model-id=anthropic.claude-3-haiku-20240307-v1:0

app.security.api-key=your_secret_key_here

#########################################################
# Temporary Upload Directory
#########################################################

file.upload.temp-directory=uploads/temp

#########################################################
# File Cleanup Scheduler
#########################################################

# Delete files older than 24 hours
file.cleanup.max-age-hours=24

#########################################################
# Spring Scheduler
#########################################################

spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=cleanup-scheduler-

